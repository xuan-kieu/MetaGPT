<!DOCTYPE html>
<html>
<head>
    <title>Test API Login</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        input { padding: 8px; margin: 5px; width: 300px; }
        button { padding: 10px 20px; background: #6366f1; color: white; border: none; border-radius: 5px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; overflow: auto; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h2>🔧 Test API Login Trực Tiếp</h2>
    
    <div>
        <h3>Thử với email/mật khẩu:</h3>
        <div>
            <input type="email" id="email" placeholder="Email" value="admin@example.com">
        </div>
        <div>
            <input type="password" id="password" placeholder="Mật khẩu" value="123456">
        </div>
        <button onclick="testLogin()">Gửi Request</button>
    </div>

    <div>
        <h3>Kết quả:</h3>
        <pre id="result">Chưa có request</pre>
    </div>

    <script>
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            document.getElementById('result').textContent = 'Đang gửi request...';
            document.getElementById('result').className = '';
            
            try {
                console.log('Gửi request đến:', 'http://localhost:5000/api/auth/login');
                
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                const resultText = JSON.stringify({
                    status: response.status,
                    statusText: response.statusText,
                    headers: Object.fromEntries([...response.headers]),
                    data: data
                }, null, 2);
                
                document.getElementById('result').textContent = resultText;
                
                if (response.ok) {
                    document.getElementById('result').className = 'success';
                    console.log('✅ Thành công:', data);
                } else {
                    document.getElementById('result').className = 'error';
                    console.log('❌ Thất bại:', data);
                }
                
            } catch (error) {
                document.getElementById('result').textContent = 'Lỗi: ' + error.message;
                document.getElementById('result').className = 'error';
                console.error('❌ Lỗi:', error);
            }
        }
        
        // Test nhanh với sai mật khẩu
        async function testWrongPassword() {
            document.getElementById('email').value = 'admin@example.com';
            document.getElementById('password').value = 'saimatkhau';
            await testLogin();
        }
    </script>
</body>
</html>
